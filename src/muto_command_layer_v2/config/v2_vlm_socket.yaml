vlm_socket:
  ros__parameters:
    action_name: /vlm/generate

    # This is the deployment provider used by the current Humble setup. Keep
    # credentials in HKU_API_KEY; never put the secret in this file.
    base_url: http://43.165.176.234:8080/v1
    wire_api: chat_completions
    default_model: gpt-5.6-sol
    system_prompt: ""
    api_key_env: HKU_API_KEY
    require_api_key: true

    request_timeout: 120.0
    max_content_parts: 16
    max_text_characters: 65536
    max_jpeg_bytes: 8388608
    max_total_jpeg_bytes: 25165824
    max_request_bytes: 41943040
    max_response_bytes: 4194304
    max_tokens: 0
    temperature: -1.0
    store_response: false
