# Provisional feed-forward mapping for the new composed x/yaw gait.
#
# This is intentionally explicit rather than hidden behind `cmd_vel * 100`.
# The calibration condition is the configured 50 Hz gait timer. Its observed
# mean in the source bag was 47.9 phases/s. X/Y are geometric predictions from
# that observed 20-phase commanded-foot cadence;
# the 2026-08-06 Nav2 bag did not contain enough pure-axis travel to measure
# them. Yaw transfers a descriptive RF2O fit from the inherited approximate
# pure-turn path; the corrected gait now uses the same exact SE(2) path for
# pure and mixed turn. CW is mirrored because its coverage was insufficient.
# Replace this file after controlled marked-field trials; do not describe it
# as a finished physical calibration.

schema_version: 1
profile_id: "muto_composed_gait_provisional_20260806_v1"
provenance: >-
  Recorded with the gait timer configured for 50 Hz; its observed mean was 47.9
  phases/s. X/Y use commanded-foot kinematics at that observed cadence; yaw
  transfers the descriptive RF2O pure-turn fit 0.00963 rad/s/level from the
  inherited gait recorded in the 2026-08-06 Nav2 bag and mirrors it for CW.
  The executing exact-turn gait is unmeasured. No external ground truth and
  no unmeasured cadence scaling.
reference_phase_rate_hz: 50.0

