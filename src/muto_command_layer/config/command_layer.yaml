command_layer:
  ros__parameters:
    action_name: /go_to_object
    registry_service: /sam2/get_stored_objects
    navigate_to_pose_action: /navigate_to_pose
    global_costmap_service: /global_costmap/get_costmap
    target_pose_topic: /object_navigation/target_pose
    explore_service: /explore
    save_map_service: /save_map
    slam_toolbox_save_map_service: /slam_toolbox/save_map
    # Empty resolves to $HOME/.ros/maps at command-layer startup.
    map_save_directory: ""
    default_map_name: muto_map
    explore_and_record_action: /explore_and_record
    # Safety-wrapped frontier primitive scheduled by model_commander.
    explore_frontier_action: /command_primitives/explore_frontier
    frontier_control_service: /control_exploration
    spin_action: /spin
    registry_save_service: /sam2/save_stored_objects
    exploration_completion_topic: /explore/exploration_complete

    global_frame: map
    robot_base_frame: base_frame

    # Select a reachable Nav2 global-costmap cell on or beyond this radius.
    approach_distance: 0.75
    # The radius is a lower bound for object standoff only. Nav2's configured
    # footprint and inflation layer provide collision clearance in the costmap.
    approach_robot_radius: 0.16
    approach_start_snap_distance: 0.5
    # Nav2 costs 253 (inscribed), 254 (lethal), and 255 (unknown) stay blocked.
    approach_maximum_cost: 252

    registry_timeout: 3.0
    nav_server_timeout: 5.0
    global_costmap_timeout: 5.0
    tf_timeout: 0.2

    # Zero leaves the Nav2 execution time unlimited. Cancellation still works.
    navigation_timeout: 0.0
    cancel_timeout: 2.0
    exploration_service_timeout: 5.0
    save_map_timeout: 10.0

    # Explore, pause, scan 360 degrees in six observed steps, and repeat.
    # Once frontiers are exhausted, walk geometry-selected viewpoints and
    # continue scanning the static scene instead of ending immediately.
    program_endpoint_timeout: 5.0
    # Do not consume the bounded travel interval while the frontier planner is
    # still computing and dispatching its first Nav2 goal.
    frontier_navigation_start_timeout: 15.0
    # This is a minimum interval. If Nav2 is still driving to a frontier when
    # it elapses, finish that travel goal before pausing to scan.
    exploration_cycle_duration: 10.0
    # Per-step timeout; observation normally ends sooner after this many fresh
    # crop-free detector heartbeat messages. Set the frame count to 0 for a
    # fixed dwell.
    observation_duration: 3.0
    observation_min_detection_frames: 3
    scan_step_count: 6
    spin_time_allowance: 15.0
    navigation_settle_time: 0.25
    finish_active_frontier_goal_before_scan: true
    detection_heartbeat_topic: /sam2/detection_heartbeat

    # The standalone muto_exploration_bag process opens one MCAP per goal.
    # This command node only publishes lifecycle events and optionally waits
    # for the matching recorder-ready acknowledgement.
    exploration_bag_enabled: true
    exploration_bag_required: false
    exploration_bag_start_timeout: 2.0
    exploration_bag_event_topic: /explore_and_record/recording_event
    exploration_bag_status_topic: /explore_and_record/bag_status

    visibility_coverage_enabled: true
    # SLAM occupancy geometry used only for predicted visibility coverage.
    visibility_map_topic: /map
    visibility_target_pose_topic: /explore/visibility_target_pose
    visibility_coverage_service: /command_layer/visibility_coverage
    visibility_map_timeout: 10.0
    visibility_free_threshold: 20
    visibility_occupied_threshold: 65
    # Costs 253 (inscribed), 254 (lethal), and 255 (unknown) stay blocked.
    visibility_maximum_cost: 252
    # Fallback clearance when the standalone planner has no Nav2 cost layer.
    visibility_robot_clearance: 0.22
    visibility_candidate_spacing: 0.5
    visibility_range: 2.5
    visibility_boundary_weight: 2.0
    visibility_nominal_linear_speed: 0.20
    visibility_scan_time: 45.0
    visibility_start_snap_distance: 0.5
    visibility_minimum_new_cells: 1
    visibility_completion_ratio: 0.98

    # The ratio is predicted 2-D visibility, not measured camera coverage.
    # Zero leaves the number of coverage viewpoints unlimited. Failed Nav2
    # targets are discarded without predicted-visibility credit.
    visibility_max_viewpoints: 0
    visibility_max_navigation_failures: 3
    visibility_coverage_max_points: 8

    # Empty selects Nav2's configured default NavigateToPose behavior tree.
    behavior_tree: ""

object_search:
  ros__parameters:
    action_name: /find_object
    registry_service: /sam2/get_stored_objects
    vlm_action: /vlm/generate
    match_topic: /object_search/matches

    # Empty selects the VLM socket's default model.
    vlm_model: ""

    registry_timeout: 3.0
    vlm_server_timeout: 5.0
    vlm_result_timeout: 180.0
    cancel_timeout: 2.0

    max_prompt_characters: 8192
    max_registry_objects: 256
    max_shortlist_size: 7
    max_description_characters: 4096
    max_candidate_jpeg_bytes: 8388608

    # Emit validated shortlist/filter decisions without raw prompts or images.
    log_vlm_judgements: true
    max_log_description_characters: 240
    max_log_filtered_ids: 32

    # Refuse ambiguous visual refinement when any shortlisted JPEG is missing.
    require_all_candidate_images: true

active_object_search:
  ros__parameters:
    action_name: /find_something
    find_object_action: /find_object
    explore_and_record_action: /explore_and_record
    registry_topic: /sam2/stored_objects

    endpoint_timeout: 5.0
    # FindObject can perform two sequential VLM calls.
    find_result_timeout: 400.0
    child_stop_timeout: 10.0
    max_prompt_characters: 8192

model_commander:
  ros__parameters:
    action_name: /look_for_object
    vlm_action: /vlm/generate
    find_object_action: /find_object
    go_to_object_action: /go_to_object
    explore_frontier_action: /command_primitives/explore_frontier
    navigate_to_pose_action: /navigate_to_pose
    visibility_coverage_service: /command_layer/visibility_coverage
    spin_action: /spin
    rotate_cmd_vel_topic: /cmd_vel_nav
    registry_save_service: /sam2/save_stored_objects
    detection_heartbeat_topic: /sam2/detection_heartbeat
    registry_topic: /sam2/stored_objects
    robot_pose_topic: /odometry/filtered
    visual_observation_topic: /camera/color/image_raw
    status_topic: /model_commander/status
    # One parent bag spans the complete model-supervised mission, including
    # registry-only checks, waits, planning decisions, and all primitives.
    command_bag_enabled: true
    command_bag_required: false
    command_bag_start_timeout: 2.0
    command_bag_event_topic: /model_commander/recording_event
    command_bag_status_topic: /model_commander/bag_status
    decision_event_topic: /model_commander/decision_event
    inspected_image_topic: /model_commander/inspected_image

    # Empty selects the VLM socket's default model.
    # Command planning is latency-sensitive; use a faster model than object
    # crop matching unless launch explicitly overrides it.
    vlm_model: gpt-5.6-luna

    endpoint_timeout: 5.0
    vlm_result_timeout: 60.0
    find_result_timeout: 400.0
    child_stop_timeout: 10.0

    # A zero in the action goal selects these finite mission budgets.
    default_max_duration: 1800.0
    maximum_mission_duration: 7200.0
    default_max_planning_steps: 64
    maximum_planning_steps: 256
    maximum_command_dispatches: 128

    max_prompt_characters: 8192
    max_reason_characters: 512
    max_visual_observation_characters: 512
    max_state_message_characters: 512
    max_wait_seconds: 60.0
    max_exploration_seconds: 60.0
    max_rotation_radians: 6.283185307179586
    max_observation_seconds: 30.0
    spin_time_allowance: 15.0
    # Model-commanded rotate publishes to the pre-smoother Nav2 velocity topic
    # so nav2_velocity_smoother remains the final hard limiter before
    # hardware. Completion remains based on odometry, not feed-forward
    # prediction.
    rotate_executable_yaw_velocity: 0.30
    # Ground motion can be slower than commanded-foot geometry. Use a
    # conservative observed-rate floor only for timeout sizing.
    rotate_timeout_reference_yaw_velocity: 0.15
    rotate_goal_tolerance: 0.08
    rotate_control_period: 0.05
    rotate_stop_publish_count: 3
    checkpoint_timeout: 10.0
    observation_min_detection_frames: 3
    # Frontier time is not coverage. A step below 0.10 m is reported as no
    # spatial progress, and no-match requires at least 0.50 m of odometry-
    # verified travel plus the other evidence below. These may occur in any
    # order.
    minimum_explore_progress_distance_m: 0.10
    minimum_no_match_travel_distance_m: 0.50
    minimum_no_match_observations: 4
    minimum_no_match_rotation_radians: 6.283185307179586
    minimum_no_match_checkpoints: 1

    # Model/VLM failure defers without motion. Repeated failure aborts safely.
    # Visibility coverage is advisory planner context. Keep its deadline below
    # camera freshness limits so a missing costmap can never block a mission.
    visibility_context_timeout: 0.5
    # Orbbec color camera horizontal FOV (58.4 degrees). Successful observe
    # primitives contribute pose-aware inspection evidence to coverage.
    visibility_observation_horizontal_fov_rad: 1.019272
    visibility_max_observations: 64
    planner_retry_initial_delay: 2.0
    planner_retry_max_delay: 30.0
    command_retry_initial_delay: 1.0
    command_retry_max_delay: 10.0
    max_consecutive_planner_failures: 3
    max_consecutive_command_failures: 3
    max_repeated_no_progress_decisions: 4

    # Every VLM scheduling request must inspect a newly received color frame.
    # A bounded worker subscribes only during capture and JPEG-encodes only
    # when replanning.
    visual_observation_timeout: 5.0
    visual_observation_max_age: 2.0
    visual_observation_jpeg_quality: 80
    visual_observation_max_width: 960
    visual_observation_max_height: 720
    visual_observation_max_jpeg_bytes: 1048576
    visual_observation_max_source_width: 8192
    visual_observation_max_source_height: 8192
    visual_observation_max_source_bytes: 67108864
    # Dynamic camera and detector subscriptions are owned by dedicated
    # single-thread executors. Capacity-one admission and bounded shutdown
    # prevent executor handle races, unbounded queues, and lock-order stalls.
    input_worker_poll_period: 0.02
    input_worker_stop_timeout: 2.0

    # The VLM periodically inspects long-running exploration/wait commands.
    # It may only continue the owned command or stop it for deterministic
    # registry checking and replanning; Nav2 remains the safety controller.
    active_visual_monitoring: true
    active_inspection_period: 20.0
    active_inspection_timeout: 30.0
    active_inspection_max_decision_age: 90.0
    max_consecutive_active_inspection_failures: 3
    max_visual_interrupts: 8
    monitor_period: 0.05
    status_publish_period: 1.0

natural_language_command_router:
  ros__parameters:
    action_name: /natural_language_command
    vlm_action: /vlm/generate
    find_object_action: /find_object
    look_for_object_action: /look_for_object
    go_to_object_action: /go_to_object
    explore_service: /explore
    save_map_service: /save_map
    decision_event_topic: /natural_language_command/decision_event

    # Empty selects the VLM socket's default model.
    # Command routing is latency-sensitive and mostly strict enum
    # classification; use the tested smaller model unless launch overrides it.
    vlm_model: gpt-5.3-codex-spark

    endpoint_timeout: 5.0
    vlm_result_timeout: 45.0

    # FindObject can perform two sequential VLM calls.
    find_result_timeout: 400.0
    save_map_result_timeout: 15.0
    cancel_timeout: 2.0

    # Local validation repeats every bound in the VLM JSON schema.
    max_query_characters: 4096
    max_object_query_characters: 1024
    max_map_name_characters: 128
