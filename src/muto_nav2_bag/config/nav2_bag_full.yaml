nav2_bag_recorder:
  ros__parameters:
    # Opt-in broad Nav2 profile for short, manually bounded deep dives. The
    # directory name is generated when bag_name is empty.
    output_directory: "/opt/muto_rs_ws/bags"
    bag_name: ""
    storage_id: mcap
    # Fast chunk compression makes repeated maps/costmaps inexpensive while
    # keeping CPU cost low enough for field diagnostics.
    storage_preset: zstd_fast
    max_cache_size: 52428800
    max_bag_directories: 20
    include_hidden_topics: true
    # Keep the recorder topic-scoped on every ROS distro. Humble cannot select
    # service events generically; newer distros must not pull every service in.
    record_all_services: false

    metadata_topic: /muto/nav2_bag/metadata
    event_topic: /muto/nav2_bag/event
    status_topic: /muto/nav2_bag/status
    path_topic: /muto/nav2_bag/path
    stop_service: /muto/nav2_bag/stop

    # Explicitly navigation-scoped. Camera images, point clouds, SAM output,
    # raw sensor streams, and /bond are intentionally absent.
    topics:
      # Recorder provenance and operator annotations.
      - /muto/nav2_bag/metadata
      - /muto/nav2_bag/event
      - /muto/nav2_bag/status
      - /muto/nav2_bag/path
      - /clock

      # Robot pose, map, and localization inputs used by Nav2.
      - /tf
      - /tf_static
      - /map
      - /map_metadata
      - /pose
      - /odometry/filtered
      - /scan_odom
      - /scan_odom_raw
      - /foot_odom
      - /imu/data_processed
      - /muto/commanded_gait_state
      - /muto/motion_command_state
      - /lidar/filtered_laserscan
      - /lidar/filtered_laserscan_no_downsample
      - /camera/filtered_laserscan

      # Goal sources, paths, and the command before/after velocity smoothing.
      - /clicked_point
      - /goal_pose
      - /initialpose
      - /plan
      - /plan_smoothed
      - /received_global_plan
      - /lookahead_point
      - /lookahead_collision_arc
      - /cmd_vel_nav
      - /cmd_vel

      # Published costmaps and footprints.
      - /global_costmap/costmap
      - /global_costmap/costmap_raw
      - /global_costmap/costmap_updates
      - /global_costmap/published_footprint
      - /local_costmap/costmap
      - /local_costmap/costmap_raw
      - /local_costmap/costmap_updates
      - /local_costmap/published_footprint

      # Nav2 action progress. Goal/result service payloads require service
      # introspection and are not available on the deployed Humble graph.
      - /navigate_to_pose/_action/feedback
      - /navigate_to_pose/_action/status
      - /navigate_through_poses/_action/feedback
      - /navigate_through_poses/_action/status
      - /compute_path_to_pose/_action/feedback
      - /compute_path_to_pose/_action/status
      - /compute_path_through_poses/_action/feedback
      - /compute_path_through_poses/_action/status
      - /smooth_path/_action/feedback
      - /smooth_path/_action/status
      - /follow_path/_action/feedback
      - /follow_path/_action/status
      - /spin/_action/feedback
      - /spin/_action/status
      - /backup/_action/feedback
      - /backup/_action/status
      - /wait/_action/feedback
      - /wait/_action/status

      # Frontier/object-navigation goal mirrors and mission context.
      - /explore/frontiers
      - /explore/selected_frontier
      - /explore/optimized_map
      - /explore/frontier_goal_result
      - /explore/visibility_target_pose
      - /frontier_goal_adapter/original_goal
      - /frontier_goal_adapter/projected_goal
      - /frontier_goal_adapter/status
      - /frontier/navigate_to_pose/_action/feedback
      - /frontier/navigate_to_pose/_action/status
      - /muto/mission_board
      - /muto/mission_event
      - /muto/mission_rejection
      - /muto/mission_recorder_status

      # Behavior, diagnostics, parameter changes, and lifecycle state.
      - /behavior_tree_log
      - /diagnostics
      - /rosout
      - /parameter_events
      - /controller_server/transition_event
      - /planner_server/transition_event
      - /smoother_server/transition_event
      - /velocity_smoother/transition_event
      - /behavior_server/transition_event
      - /bt_navigator/transition_event
      - /global_costmap/global_costmap/transition_event
      - /local_costmap/local_costmap/transition_event
