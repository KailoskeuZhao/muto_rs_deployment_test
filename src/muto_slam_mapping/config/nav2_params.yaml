bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_frame
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 5000
    default_nav_to_pose_bt_xml: $(find-pkg-share muto_slam_mapping)/behavior_trees/muto_nav_to_pose.xml
    default_nav_through_poses_bt_xml: $(find-pkg-share muto_slam_mapping)/behavior_trees/muto_nav_through_poses.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /odometry/filtered
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.4
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.1
      required_movement_angle: 0.15
      movement_time_allowance: 13.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.2

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Conservative linear-speed step-up for the geometric Muto gait. Keep
      # yaw and acceleration limits unchanged until a marked-field trial
      # measures the higher-speed response.
      desired_linear_vel: 0.25
      # Fixed carrot distance. Keep it beyond the 0.26 m robot radius so small
      # NavFn/odometry changes near a directly-behind path do not repeatedly
      # flip RPP's selected turn direction. With velocity scaling disabled,
      # min/max lookahead and lookahead_time are not used by Humble RPP.
      lookahead_dist: 0.40
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      # Conservative physical Muto yaw-speed envelope. Higher geometric gait
      # commands are possible, but field bags showed poor achieved yaw and
      # weak combined forward+turn response. Odometry remains authoritative.
      rotate_to_heading_angular_vel: 0.30
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 0.3
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.35
      cost_scaling_gain: 1.0
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      # Humble RPP applies this limit around the *measured* odometry yaw rate
      # every controller tick. At 20 Hz, a physical 0.6 rad/s^2 value clamps a
      # 0.30 rad/s rotate-to-path request to 0.03 rad/s indefinitely when the
      # measured response is weak or delayed. Keep this controller-internal
      # clamp non-binding across the full configured [-0.30, +0.30] range;
      # nav2_velocity_smoother below remains the physical 1.0 rad/s^2 limiter.
      max_angular_accel: 12.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      footprint_padding: 0.01
      update_frequency: 5.0
      publish_frequency: 2.0
      # The LiDAR-driven odometry path is nominally 16 Hz (62.5 ms/scan).
      # Allow three scan periods for RF2O, EKF and executor scheduling jitter.
      transform_tolerance: 0.2
      global_frame: odom
      robot_base_frame: base_frame
      # Field-measured walking envelope is approximately 0.26 m radius. The
      # 0.01 m footprint padding below makes the effective radius 0.27 m.
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.04
      robot_radius: 0.26
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: lidar camera
        # The LiDAR scan plane is mounted above the robot. Near-field returns
        # are therefore treated as external structure (for example chair
        # uprights), not self-returns. Preserve them even after they enter the
        # footprint so collision checks and recovery behaviors fail closed.
        footprint_clearing_enabled: false
        max_obstacle_height: 2.0
        combination_method: 1
        lidar:
          topic: /lidar/filtered_laserscan
          # Treat the source as stale only after about three nominal 16 Hz periods.
          expected_update_rate: 0.2
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: true
        camera:
          topic: /camera/filtered_laserscan
          obstacle_max_range: 2.5
          obstacle_min_range: 0.30
          raytrace_max_range: 3.0
          raytrace_min_range: 0.30
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          # Unobserved camera bins are NaN and must not clear outside the camera FOV.
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # NavFn searches with a point center while the smoother/controller
        # validate the complete 0.27 m effective footprint. Retain a modest
        # 0.15 m soft-clearance band for this cluttered room; the footprint
        # collision check, not inflation, remains the hard safety boundary.
        cost_scaling_factor: 6.0
        inflation_radius: 0.42
        inflate_unknown: false
        # Frontier navigation intentionally plans into NO_INFORMATION cells.
        # Humble treats every unknown cell as an inflation source when this is
        # true, which can turn nearly the complete rolling/global map lethal.
        inflate_around_unknown: false
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    # Match the 1 Hz RateController in the navigation behavior trees.
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # Do not substitute a plan endpoint outside the goal checker's XY tolerance.
      tolerance: 0.15
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_frame
    transform_tolerance: 0.2
    # Humble's fixed seven-point Savitzky-Golay filter removes small NavFn
    # artifacts quickly. Keep SimpleSmoother loaded as an explicit rollback,
    # while the behavior trees select savitzky_golay_smoother.
    smoother_plugins: ["savitzky_golay_smoother", "simple_smoother"]
    savitzky_golay_smoother:
      plugin: "nav2_smoother::SavitzkyGolaySmoother"
      do_refinement: true
      refinement_num: 2
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Direct commander rotations use the faster Spin envelope below. RPP's
    # path-following heading request remains at 0.30 rad/s.
    max_velocity: [0.25, 0.0, 0.50]
    min_velocity: [-0.10, 0.0, -0.50]
    max_accel: [0.15, 0.0, 1.0]
    max_decel: [-0.2, 0.0, -1.0]
    odom_topic: /odometry/filtered
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_frame
    transform_tolerance: 0.1
    simulate_ahead_time: 1.5
    # Commander rotate_to_heading dispatches Nav2 Spin, so it has a separate
    # faster envelope than path-following RPP.
    max_rotational_vel: 0.50
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      footprint_padding: 0.01
      # Match the local costmap's LiDAR/odometry TF wait budget.
      transform_tolerance: 0.2
      global_frame: map
      robot_base_frame: base_frame
      # Match the local costmap's measured walking envelope.
      robot_radius: 0.26
      resolution: 0.04
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: lidar camera
        footprint_clearing_enabled: false
        max_obstacle_height: 2.0
        combination_method: 1
        lidar:
          topic: /lidar/filtered_laserscan
          # Treat the source as stale only after about three nominal 16 Hz periods.
          expected_update_rate: 0.2
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: true
        camera:
          topic: /camera/filtered_laserscan
          obstacle_max_range: 2.5
          obstacle_min_range: 0.30
          raytrace_max_range: 3.0
          raytrace_min_range: 0.30
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          # Unobserved camera bins are NaN and must not clear outside the camera FOV.
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # Match the local soft-clearance preference without making narrow but
        # physically passable routes prohibitively expensive.
        cost_scaling_factor: 6.0
        inflation_radius: 0.42
        inflate_unknown: false
        # Must agree with GridBased.allow_unknown below. Real mapped obstacles
        # are inflated; unexplored cells are not converted into virtual walls.
        inflate_around_unknown: false
      always_send_full_costmap: true
