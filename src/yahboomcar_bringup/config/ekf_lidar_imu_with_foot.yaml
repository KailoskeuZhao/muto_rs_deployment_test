ekf_filter_node:
  ros__parameters:
    # Overlay loaded after ekf_lidar_imu.yaml. Motion comes from measured servo
    # FK only when the gait history proves continuous commanded stance. Contact
    # and slip remain unmeasured, so fuse only low-trust planar body velocity;
    # LiDAR retains planar pose/yaw ownership and IMU retains yaw-rate ownership.
    odom1: /foot_odom
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 20
    odom1_nodelay: true
    odom1_differential: false
    odom1_relative: false
    odom1_twist_rejection_threshold: 1.0
