frontier_explorer:
  ros__parameters:
    # Interfaces provided by muto_slam_mapping and its Nav2 launch.
    map_topic: /map
    costmap_topic: /global_costmap/costmap
    local_costmap_topic: /local_costmap/costmap
    navigate_to_pose_action_name: /navigate_to_pose
    global_frame: map
    robot_base_frame: base_frame

    # Visualization and integration outputs.
    frontier_marker_topic: /explore/frontiers
    selected_frontier_topic: /explore/selected_frontier
    optimized_map_topic: /explore/optimized_map
    frontier_marker_scale: 0.15
    completion_event_enabled: true
    completion_event_topic: /explore/exploration_complete

    # SLAM Toolbox publishes /map as reliable, transient-local data. Nav2
    # costmaps are consumed as reliable, volatile streams by the explorer.
    map_qos_durability: transient_local
    map_qos_reliability: reliable
    map_qos_depth: 1
    map_qos_autodetect_on_startup: false
    map_qos_autodetect_timeout_s: 2.0
    costmap_qos_reliability: reliable
    costmap_qos_depth: 10
    local_costmap_qos_reliability: inherit
    local_costmap_qos_depth: -1

    # Runtime control. The launch file exposes matching overrides.
    autostart: true
    control_service_enabled: true
    map_processing_rate_hz: 1.0
    escape_enabled: true
    return_to_start_on_complete: false

    # Keep bounded-horizon DP below the upstream maximum profile to leave CPU
    # headroom for SLAM, Nav2, depth processing, YOLO, and SAM.
    mrtsp_solver: dp
    dp_solver_candidate_limit: 12
    dp_planning_horizon: 8
    weight_distance_wd: 1.0
    weight_gain_ws: 1.0
    sensor_effective_range_m: 1.5
    # Match the commanded limits in nav2_params.yaml rather than TurtleBot
    # scoring defaults. These values affect scoring only; they do not command.
    max_linear_speed_vmax: 0.30
    max_angular_speed_wmax: 0.50

    # Frontier extraction on the 0.04 m SLAM/Nav2 grids.
    frontier_map_optimization_enabled: true
    sigma_s: 2.0
    sigma_r: 30.0
    dilation_kernel_radius_cells: 1
    occ_threshold: 65
    min_frontier_size_cells: 5
    frontier_candidate_min_goal_distance_m: 0.50
    frontier_selection_min_distance: 0.50
    frontier_visit_tolerance: 0.40

    # Active-goal monitoring. The reveal model follows the 360-degree LiDAR
    # costmap source; the range matches its configured obstacle range.
    goal_preemption_enabled: true
    goal_preemption_min_interval_s: 2.0
    goal_skip_on_blocked_goal: true
    goal_preemption_complete_if_within_m: 0.25
    goal_preemption_lidar_range_m: 15.0
    goal_preemption_lidar_fov_deg: 360.0
    goal_preemption_lidar_ray_step_deg: 1.0
    goal_preemption_lidar_min_reveal_length_m: 0.5
    goal_preemption_lidar_yaw_offset_deg: 0.0

    # SLAM Toolbox publishes a new map every 3.0 s. Waiting slightly longer
    # after a completed goal prevents immediate reselection from the old map.
    post_goal_settle_enabled: true
    post_goal_min_settle: 3.2

    # Leave failure suppression opt-in until real navigation failure behavior
    # has been observed on the robot. The bounded settings are ready if enabled.
    frontier_suppression_enabled: false
    frontier_suppression_attempt_threshold: 2
    frontier_suppression_base_size_m: 1.0
    frontier_suppression_expansion_size_m: 0.5
    frontier_suppression_timeout_s: 90.0
    frontier_suppression_no_progress_timeout_s: 20.0
    frontier_suppression_progress_epsilon_m: 0.10
    frontier_suppression_startup_grace_period_s: 15.0
    frontier_suppression_max_attempt_records: 256
    frontier_suppression_max_regions: 64
    all_frontiers_suppressed_behavior: stay
