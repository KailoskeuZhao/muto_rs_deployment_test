exploration_bag_recorder:
  ros__parameters:
    # Parent directory for action-scoped exploration bags.
    output_directory: "/opt/muto_rs_ws/bags"
    storage_id: mcap
    storage_preset: none

    # Discover the complete graph, excluding high-bandwidth raw/derived image
    # and point-cloud payloads. Navigation, odometry, action, structured
    # detection, registry, TF, map, scan, log, and operator-event topics remain.
    # Leave `topics` undeclared here for the node's empty-list default. To use
    # an explicit source contract, uncomment a non-empty list such as:
    # topics: [/tf, /tf_static, /map, /odom, /scan]
    topics_regex: ""
    exclude_regex: "^(/camera/[^/]+/(image_raw|points)(/.*)?|/sam2/(annotated_image|mask|instance_mask|instance_pointcloud)(/.*)?|/lidar/PointCloud.*)$"
    include_hidden_topics: true
    # Native all-services selection is available on newer rosbag2. On Humble,
    # exposed service-event topics are still included by all-topic recording.
    record_all_services: true
    max_cache_size: 104857600
    post_terminal_delay: 0.25

    lifecycle_event_topic: /explore_and_record/recording_event
    status_topic: /explore_and_record/bag_status
    path_topic: /explore_and_record/last_bag_path
    operator_event_topic: /explore_and_record/operator_event
