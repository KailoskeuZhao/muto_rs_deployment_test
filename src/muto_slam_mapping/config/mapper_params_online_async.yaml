slam_toolbox:
  ros__parameters:

    odom_frame: odom
    map_frame: map
    base_frame: base_frame
    scan_topic: /lidar/filtered_laserscan_no_downsample

    mode: mapping
    # Required by the v2 command executive's /save_map integration. This creates the
    # canonical /slam_toolbox/save_map occupancy-map service.
    use_map_saver: true

    resolution: 0.04
    # Async mode should retain only the newest scan while waiting for odom TF.
    scan_queue_size: 1
    # Publish map->odom at the Nav2 controller's 20 Hz cadence and retain the
    # standard future-dating/TF wait budget.
    transform_publish_period: 0.05
    transform_timeout: 0.5
    map_update_interval: 3.0
